```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo - Bottons Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CABEÇALHO -->

    <header class="header">

        <div class="logo">
            🔘 Bottons Store
        </div>

        <nav>
            <a href="index.html">🏠 Loja</a>
        </nav>

    </header>


    <!-- PAINEL -->

    <main class="admin">

        <section class="admin-header">

            <h1>🔐 Painel Administrativo</h1>

            <p>
                Gerencie os produtos da sua loja.
            </p>

        </section>


        <!-- ADICIONAR PRODUTO -->

        <section class="admin-card">

            <h2>➕ Adicionar produto</h2>

            <form id="form-produto">

                <!-- FOTO -->

                <div class="campo">

                    <label for="imagem">
                        📷 Foto do produto
                    </label>

                    <input
                        type="file"
                        id="imagem"
                        accept="image/*"
                        required
                    >

                    <div id="preview-container">
                        <img
                            id="preview"
                            alt="Pré-visualização"
                        >
                    </div>

                </div>


                <!-- NOME -->

                <div class="campo">

                    <label for="nome">
                        🏷️ Nome do produto
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Ex: Botton Gato"
                        required
                    >

                </div>


                <!-- PREÇO -->

                <div class="campo">

                    <label for="preco">
                        💰 Preço
                    </label>

                    <input
                        type="number"
                        id="preco"
                        placeholder="5.00"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <!-- DESCRIÇÃO -->

                <div class="campo">

                    <label for="descricao">
                        📝 Descrição
                    </label>

                    <textarea
                        id="descricao"
                        placeholder="Descreva o produto..."
                        rows="4"
                    ></textarea>

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="admin-button"
                >
                    ➕ Adicionar produto
                </button>

            </form>

        </section>


        <!-- LISTA DE PRODUTOS -->

        <section class="admin-card">

            <h2>📦 Produtos cadastrados</h2>

            <div
                id="admin-produtos"
                class="admin-produtos"
            >
                <p>Carregando produtos...</p>
            </div>

        </section>

    </main>


    <!-- RODAPÉ -->

    <footer>

        <p>
            © 2026 Bottons Store
        </p>

    </footer>


    <script src="admin.js"></script>

</body>

</html>
```
